<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IngenIA · Consultas Académicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13234A;
    --navy-deep:#0B1733;
    --paper:#F4F1E9;
    --paper-card:#FBFAF5;
    --line:#D8D2C2;
    --ink:#1C2233;
    --ink-soft:#5B5F6B;
    --stamp:#A13D2E;
    --gold:#B8923D;
    --sage:#4C6E5D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(19,35,74,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;}

  header{
    background:var(--navy);
    color:#EFE9D8;
    padding:22px 28px;
    border-bottom:4px solid var(--gold);
  }
  .header-inner{
    max-width:1040px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .crest{
    width:46px;height:46px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:16px;
    color:var(--gold);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Spectral', serif;
    font-weight:600;
    font-size:21px;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#B9C2D6;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.3px;
  }
  .header-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:#9FAFC9;
    border:1px solid #2C3D63;
    padding:6px 10px;
    border-radius:6px;
    white-space:nowrap;
  }

  main{
    flex:1;
    max-width:1040px;
    width:100%;
    margin:0 auto;
    padding:28px;
    display:grid;
    grid-template-columns:240px 1fr;
    gap:24px;
    align-items:start;
  }

  .folders{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .folders-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .folder-list{
    list-style:none;
    margin:0;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    max-height:560px;
    overflow-y:auto;
  }
  .folder-btn{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    padding:9px 10px;
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .folder-btn:hover{background:rgba(184,146,61,0.12);}
  .folder-btn:focus-visible{outline:2px solid var(--navy); outline-offset:1px;}
  .folder-btn.active{
    background:rgba(19,35,74,0.07);
    border-left-color:var(--gold);
    font-weight:500;
  }

  .panel{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    min-height:560px;
    position:relative;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .panel-head .ficha{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .panel-head .ficha b{color:var(--ink);}
  .estado{
    display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--sage);
  }
  .estado-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--sage);
  }

  .chat-log{
    flex:1;
    padding:20px 20px 8px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-height:520px;
  }

  .msg{max-width:84%; display:flex; gap:10px;}
  .msg.user{align-self:flex-end; flex-direction:row-reverse;}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:500;
  }
  .msg.bot .avatar{background:var(--navy); color:#EFE9D8;}
  .msg.user .avatar{background:#E3DCC8; color:var(--ink);}
  .bubble{
    border-radius:8px;
    padding:11px 14px;
    font-size:14px;
    line-height:1.55;
    position:relative;
  }
  .bubble p{margin:0 0 6px;}
  .bubble p:last-child{margin-bottom:0;}
  .msg.bot .bubble{
    background:#fff;
    border:1px solid var(--line);
    border-top-left-radius:2px;
  }
  .msg.bot .bubble a{
    color:var(--navy);
    font-weight:500;
    text-decoration:underline;
    text-decoration-color:var(--gold);
    text-underline-offset:2px;
  }
  .msg.bot .bubble a:hover{color:var(--stamp);}
  .msg.user .bubble{
    background:var(--navy);
    color:#F3EFE2;
    border-top-right-radius:2px;
  }
  .sello{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--stamp);
    border:1px solid var(--stamp);
    padding:2px 7px;
    border-radius:3px;
    transform:rotate(-2deg);
    opacity:0.85;
  }
  .no-encontrada .bubble{border-left:3px solid var(--gold);}

  .typing{display:flex; gap:4px; padding:2px 0;}
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--ink-soft);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  form.composer{
    display:flex;
    gap:10px;
    padding:14px 18px;
    border-top:1px solid var(--line);
  }
  .composer input{
    flex:1;
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  .composer input:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:1px;
  }
  .composer button{
    background:var(--navy);
    color:#EFE9D8;
    border:none;
    border-radius:7px;
    padding:0 18px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .composer button:hover{background:var(--navy-deep);}
  .composer button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .composer button:disabled{opacity:0.5; cursor:not-allowed;}

  footer{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:18px;
  }

  @media (max-width:720px){
    main{grid-template-columns:1fr; padding:16px;}
    .folders{order:2;}
    .folder-list{flex-direction:row; flex-wrap:wrap; max-height:none;}
    .folder-btn{border-left:none; border-bottom:3px solid transparent;}
    .folder-btn.active{border-left:none; border-bottom-color:var(--gold);}
    .chat-log{max-height:420px;}
  }

  @media (prefers-reduced-motion: reduce){
    .typing span{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="crest">FI</div>
      <div>
        <h1>IngenIA</h1>
        <p>Facultad de Ingeniería · UBA</p>
      </div>
    </div>
    <div class="header-tag">expediente nº auto-generado · consulta estudiantil</div>
  </div>
</header>

<main>
  <nav class="folders" aria-label="Temas frecuentes">
    <div class="folders-head">Carpetas de consulta</div>
    <ul class="folder-list" id="folderList">
      <li><button class="folder-btn" data-q="inscripciones">Inscripciones</button></li>
      <li><button class="folder-btn" data-q="notas">Notas</button></li>
      <li><button class="folder-btn" data-q="horarios">Horarios</button></li>
      <li><button class="folder-btn" data-q="correlativas">Correlativas</button></li>
      <li><button class="folder-btn" data-q="finales">Finales</button></li>
      <li><button class="folder-btn" data-q="becas">Becas</button></li>
      <li><button class="folder-btn" data-q="campus">Campus virtual</button></li>
      <li><button class="folder-btn" data-q="biblioteca">Biblioteca</button></li>
      <li><button class="folder-btn" data-q="certificado">Certificado</button></li>
      <li><button class="folder-btn" data-q="faltas">Faltas</button></li>
      <li><button class="folder-btn" data-q="asistencia">Asistencia</button></li>
      <li><button class="folder-btn" data-q="tramites">Trámites</button></li>
      <li><button class="folder-btn" data-q="materias">Materias</button></li>
      <li><button class="folder-btn" data-q="cursada">Cursada</button></li>
      <li><button class="folder-btn" data-q="promedio">Promedio</button></li>
      <li><button class="folder-btn" data-q="titulo">Título</button></li>
      <li><button class="folder-btn" data-q="equivalencias">Equivalencias</button></li>
      <li><button class="folder-btn" data-q="correo">Correo institucional</button></li>
      <li><button class="folder-btn" data-q="plan de estudios">Plan de estudios</button></li>
      <li><button class="folder-btn" data-q="carrera">Carrera</button></li>
    </ul>
  </nav>

  <section class="panel">
    <div class="panel-head">
      <div class="ficha">consulta <b>en curso</b> · sin registro de datos personales</div>
      <div class="estado"><span class="estado-dot"></span>en línea</div>
    </div>

    <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>

    <form class="composer" id="composer">
      <input
        type="text"
        id="userInput"
        placeholder="Escribí tu consulta, por ejemplo: ¿cómo son los finales?"
        autocomplete="off"
        aria-label="Escribir consulta"
      >
      <button type="submit">Enviar</button>
    </form>
  </section>
</main>

<footer>chatbot académico · respuestas automáticas por palabra clave · no reemplaza a Bedelía</footer>

<script>
(function(){
  // Misma base de datos y mismo orden que el Python original (el orden importa
  // porque la búsqueda se corta en la primera clave que matchea).
  var respuestas = [
    ["inscripciones", "Las inscripciones se realizan desde SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["inscripcion", "Las inscripciones se realizan desde SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["notas", "Las notas pueden visualizarse desde SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["horarios", "Los horarios se encuentran publicados por la facultad.\nLink: https://www.uba.ar"],
    ["correlativas", "Las correlativas pueden consultarse en el plan de estudios.\nLink: https://www.uba.ar"],
    ["finales", "Las fechas de finales se publican en el calendario académico.\nLink: https://www.uba.ar"],
    ["becas", "La información sobre becas está disponible en Bienestar Estudiantil.\nLink: https://www.uba.ar/becas"],
    ["campus", "El acceso al campus virtual se realiza con usuario institucional.\nLink: https://campusvirtual.uba.ar"],
    ["biblioteca", "La biblioteca funciona de lunes a viernes.\nLink: https://www.uba.ar"],
    ["certificado", "El certificado de alumno regular puede descargarse desde SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["faltas", "Las faltas permitidas dependen del reglamento de cada materia."],
    ["asistencia", "La asistencia es registrada por cada docente."],
    ["tramites", "Los trámites académicos se realizan en Secretaría de Alumnos.\nLink: https://www.uba.ar"],
    ["materias", "La oferta de materias puede consultarse en el plan de estudios.\nLink: https://www.uba.ar"],
    ["cursada", "La información sobre cursadas está disponible en SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["promedio", "El promedio académico puede consultarse desde tu historial académico en SIU Guaraní.\nLink: https://guarani.uba.ar"],
    ["titulo", "El trámite de título se realiza mediante la Secretaría Académica.\nLink: https://www.uba.ar"],
    ["equivalencias", "Las equivalencias deben solicitarse mediante expediente académico.\nLink: https://www.uba.ar"],
    ["correo", "El correo institucional es otorgado por la universidad."],
    ["mail", "El correo institucional es otorgado por la universidad."],
    ["plan", "El plan de estudios puede consultarse en la página oficial de la carrera.\nLink: https://www.uba.ar"],
    ["planes", "Los planes de estudio están disponibles en la página oficial de la facultad.\nLink: https://www.uba.ar"],
    ["estudio", "El plan de estudios contiene las materias, correlativas y carga horaria de la carrera.\nLink: https://www.uba.ar"],
    ["carrera", "La información de la carrera y su plan de estudios puede consultarse en la página oficial.\nLink: https://www.uba.ar"]
  ];

  var noEncontradaTexto = "No encontré información sobre esa consulta.\nPruebe con palabras como: notas, inscripciones, becas, finales, horarios, plan de estudios, carrera, trámites, etc.";

  var chatLog = document.getElementById('chatLog');
  var form = document.getElementById('composer');
  var input = document.getElementById('userInput');
  var sendBtn = form.querySelector('button');

  function scrollToBottom(){
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addMessage(text, who){
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + who;

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = who === 'bot' ? 'FI' : 'VOS';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var p = document.createElement('p');
    p.textContent = text;
    bubble.appendChild(p);

    if (who === 'user'){
      wrap.appendChild(bubble);
      wrap.appendChild(avatar);
    } else {
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
    }
    chatLog.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  // Arma el contenido del globo del bot, convirtiendo las líneas "Link: URL" en links clickeables.
  function renderBotContent(bubble, text){
    var lineas = text.split('\n');
    lineas.forEach(function(linea){
      if (linea.indexOf('Link:') === 0){
        var url = linea.replace('Link:', '').trim();
        var p = document.createElement('p');
        var label = document.createElement('span');
        label.textContent = 'Link: ';
        var a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = url;
        p.appendChild(label);
        p.appendChild(a);
        bubble.appendChild(p);
      } else if (linea.trim() !== ''){
        var p2 = document.createElement('p');
        p2.textContent = linea;
        bubble.appendChild(p2);
      }
    });
  }

  function addBotResponse(text, encontrada){
    var wrap = document.createElement('div');
    wrap.className = 'msg bot' + (encontrada ? '' : ' no-encontrada');

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'FI';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    renderBotContent(bubble, text);

    if (encontrada){
      var sello = document.createElement('div');
      sello.className = 'sello';
      sello.textContent = 'respuesta verificada';
      bubble.appendChild(sello);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping(){
    var wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingIndicator';

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'FI';

    var bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping(){
    var t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  function responder(consultaOriginal){
    var consulta = consultaOriginal.toLowerCase();
    var encontrada = false;
    var respuesta = '';

    for (var i = 0; i < respuestas.length; i++){
      var clave = respuestas[i][0];
      if (consulta.indexOf(clave) !== -1){
        respuesta = respuestas[i][1];
        encontrada = true;
        break;
      }
    }

    if (!encontrada){
      respuesta = noEncontradaTexto;
    }

    return { respuesta: respuesta, encontrada: encontrada };
  }

  function handleSubmit(consulta){
    consulta = consulta.trim();
    if (!consulta) return;

    addMessage(consulta, 'user');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    showTyping();

    setTimeout(function(){
      removeTyping();
      var resultado = responder(consulta);
      addBotResponse(resultado.respuesta, resultado.encontrada);
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }, 420);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    handleSubmit(input.value);
  });

  document.querySelectorAll('.folder-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.folder-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      handleSubmit(btn.getAttribute('data-q'));
    });
  });

  addBotResponse('Hola, soy IngenIA. Tengo info sobre inscripciones, notas, horarios, correlativas, finales, becas, campus, biblioteca, certificado, faltas, asistencia, trámites, materias, cursada, promedio, título, equivalencias, correo institucional, plan de estudios y carrera. ¿En qué te puedo ayudar?', true);
})();
</script>

</body>
</html>
